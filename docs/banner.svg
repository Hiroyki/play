<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="PLAY">
  <style>
    .s{fill:#fff;fill-opacity:0;stroke:#fff;stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;animation:trace 10s cubic-bezier(.6,0,.2,1) infinite}
    .l{animation-delay:.12s}.y{animation-delay:.3s}
    .t{fill:#fff;transform-box:fill-box;transform-origin:34% 50%;animation:land 10s cubic-bezier(.22,.8,.24,1) infinite}
    .r{animation:floor 10s ease infinite}
    .g{animation:glow 10s ease infinite}
    @keyframes trace{0%{stroke-dashoffset:1;fill-opacity:0;stroke-opacity:1}12%{stroke-dashoffset:0;fill-opacity:0}19%,90%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:1}97%,100%{stroke-dashoffset:0;fill-opacity:0;stroke-opacity:0}}
    @keyframes land{0%,3%{opacity:0;transform:translateX(-190px) rotate(-140deg) scale(.4)}15%,44%{opacity:1;transform:none}56%,90%{opacity:1;transform:rotate(360deg)}97%,100%{opacity:0;transform:rotate(360deg)}}
    @keyframes floor{0%,14%{opacity:0}26%,90%{opacity:.16}97%,100%{opacity:0}}
    @keyframes glow{0%,15%{opacity:.25}20%{opacity:1}38%,90%{opacity:.5}100%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.s,.t,.r,.g{animation:none}.s{fill-opacity:1;stroke-dashoffset:0}.r{opacity:.16}}
  </style>
  <defs>
    <radialGradient id="a"><stop stop-color="#fff" stop-opacity=".2"/><stop offset=".45" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="f" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="m"><rect x="0" y="126" width="460" height="72" fill="url(#f)"/></mask>
    <g id="w">
      <path d="M14 47H101C116 47 124 57 124 71.5S116 96 101 96H36V119H14V79H96.5A7.500 7.500 0 0 0 96.500 64H33C22 64 14 57 14 47Z"/>
      <path d="M134 47H155V93A8 8 0 0 0 163 101H221V119H155A21 21 0 0 1 134 98Z"/>
      <path d="M235 47L311 83L235 119Z"/>
      <path d="M314 47H343L374 78L405 47H436L364 119H334L360 93Z"/>
    </g>
  </defs>
  <rect width="1280" height="320" rx="18"/>
  <ellipse class="g" cx="640" cy="146" rx="620" ry="210" fill="url(#a)"/>
  <g transform="translate(325.600 12) scale(1.400)">
    <path class="s p" pathLength="1" d="M14 47H101C116 47 124 57 124 71.5S116 96 101 96H36V119H14V79H96.500A7.500 7.500 0 0 0 96.500 64H33C22 64 14 57 14 47Z"/>
    <path class="s l" pathLength="1" d="M134 47H155V93A8 8 0 0 0 163 101H221V119H155A21 21 0 0 1 134 98Z"/>
    <path class="s y" pathLength="1" d="M314 47H343L374 78L405 47H436L364 119H334L360 93Z"/>
    <path class="t" d="M235 47L311 83L235 119Z"/>
    <g mask="url(#m)"><use class="r" href="#w" fill="#fff" transform="translate(0 244) scale(1 -1)"/></g>
  </g>
</svg>
